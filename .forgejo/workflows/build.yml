on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README*"

jobs:
  docker-publish:
    runs-on: auriga
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set registry
        run: echo "REGISTRY=${FORGEJO_SERVER_URL#http://}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = true
              insecure = true

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          source: "."
          push: true
          set: |
            frontend.tags=${{ env.REGISTRY }}/migalmoreno/tubo-frontend:latest
            backend.tags=${{ env.REGISTRY }}/migalmoreno/tubo-backend:latest
            bg-helper.tags=${{ env.REGISTRY }}/migalmoreno/tubo-bg-helper:latest
            *.platform+=linux/arm64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
