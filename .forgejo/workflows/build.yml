on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README*"

jobs:
  docker-publish:
    runs-on: cygnus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set registry
        run: echo "REGISTRY=${FORGEJO_SERVER_URL#http://}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ env.REGISTRY }}"]
              http = true
              insecure = true

      - name: Login to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          source: "."
          push: true
          set: |
            frontend.tags=${{ env.REGISTRY }}/migalmoreno/tubo-frontend:latest
            backend.tags=${{ env.REGISTRY }}/migalmoreno/tubo-backend:latest
            bg-helper.tags=${{ env.REGISTRY }}/migalmoreno/tubo-bg-helper:latest
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Deploy
        run: curl ${{ vars.WEBHOOK_URL }}/hooks/tubo-deploy

      - name: Trigger blog rebuild
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"master"}' \
            ${{ github.server_url }}/api/v1/repos/migalmoreno/blog/actions/workflows/build-and-deploy.yml/dispatches
